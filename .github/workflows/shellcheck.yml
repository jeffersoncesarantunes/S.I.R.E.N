name: SIREN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck on all shell files
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./
          severity: style

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/kcore_extract.py
          echo "Python syntax OK"

  shell-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check lib sourcing
        run: |
          for f in lib/*.sh; do
            bash -n "$f" && echo "Syntax OK: $f"
          done
          bash -n src/siren.sh && echo "Syntax OK: src/siren.sh"
